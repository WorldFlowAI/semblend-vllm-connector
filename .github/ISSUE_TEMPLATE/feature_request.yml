name: Feature Request
description: Propose connector functionality or integration work.
title: "[Connector] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What use case or limitation should this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change?
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety Considerations
      description: How does this preserve exact prefix-cache semantics and fail-closed behavior?
    validations:
      required: true
